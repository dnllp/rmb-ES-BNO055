; Roomba cuadrícula — Propuesta B (ESP32 + BTS7960 + encoder de un canal + BNO055)
; Compilar:        pio run -e esp32dev
; Subir firmware:  pio run -e esp32dev -t upload
; Subir la web:    pio run -e esp32dev -t uploadfs
; Pruebas en PC:   pio test -e native

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0       ; Arduino-ESP32 2.0.17, versión fija
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags =
    -I include                     ; las librerías de lib/ también ven roomba_config.h
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    adafruit/Adafruit BNO055@^1.6.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    esp32async/ESPAsyncWebServer@^3.7.0
    esp32async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.0

[env:native]                       ; pruebas del planificador en la PC
platform = native
test_framework = unity
build_src_filter = -<*>
lib_compat_mode = off
lib_ignore = Bts7960, SingleEncoder, Imu, Pose, Motion, Safety, Mission, WebApi
build_flags = -std=gnu++17 -I include
